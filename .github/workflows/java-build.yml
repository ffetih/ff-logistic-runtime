# Reusable: build and test one FF Logistic repository, the way its own build.sh does locally.
#
# The repositories it builds on (ff-logistic-base, and ff-logistic-shared for the applications)
# are cloned and installed first, without their tests: their own CI ran those. Each is cloned at
# the branch this build runs for when it has one of that name (a sprint's pull requests,
# sprint/s05 in every repository, build against each other and can go green together), and at
# main otherwise. A build on main clones main: merging still follows the build order. Repositories its tests only read (siblings: the identity tests read runtime's realm
# file) are cloned too. All are cloned next to the checked-out one, under their short names, as
# they sit locally (D:\dev\workspace\ff-logistic\base, ...\runtime): a test that finds a file
# by walking up to a sibling folder finds it here too. All six repositories are public, so no
# token is needed to clone them.
#
# The jars are uploaded as the artifact "jars", with their paths, for java-publish.yml.
#
#   jobs:
#     build:
#       uses: ffetih/ff-logistic-runtime/.github/workflows/java-build.yml@main
#       with:
#         prebuild: base shared
#         siblings: runtime
name: Java build (reusable)

on:
  workflow_call:
    inputs:
      prebuild:
        description: The repositories this one builds on, in build order, by short name ("base shared")
        type: string
        default: ""
      siblings:
        description: Repositories its tests read files from, cloned next to it but not built ("runtime")
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The Maven Wrapper downloads Maven itself from Maven Central on first use, and a single
      # failed download failed a whole build once (S02-10). Kept in the cache between runs, and
      # fetched here, before anything needs it, with a few tries.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Fetch Maven
        run: |
          for attempt in 1 2 3 4; do
            if ./mvnw --version > /dev/null; then ./mvnw --version | head -1; exit 0; fi
            echo "::warning::fetching Maven failed (attempt $attempt); trying again in 15 s"
            sleep 15
          done
          exit 1
      - name: Check out the repositories next to this one
        if: inputs.prebuild != '' || inputs.siblings != ''
        run: |
          set -euo pipefail
          # The pull request's source branch, or the pushed branch
          branch="${{ github.head_ref || github.ref_name }}"
          for repo in ${{ inputs.prebuild }} ${{ inputs.siblings }}; do
            url="https://github.com/ffetih/ff-logistic-$repo.git"
            if [ "$branch" != main ] && git ls-remote --exit-code --heads "$url" "$branch" > /dev/null; then
              ref="$branch"
            else
              ref=main
            fi
            git clone --quiet --depth 1 --branch "$ref" "$url" "../$repo"
            echo "../$repo: ff-logistic-$repo $ref at $(git -C "../$repo" rev-parse --short HEAD)"
          done
      - name: Build what it builds on
        if: inputs.prebuild != ''
        run: |
          set -euo pipefail
          for repo in ${{ inputs.prebuild }}; do
            echo "::group::ff-logistic-$repo"
            "../$repo/build.sh" -q -DskipTests
            echo "::endgroup::"
          done
      - name: Build and test
        run: ./build.sh
      # The root pom.xml rides along so the artifact keeps the jars' paths from the repository
      # root (upload-artifact cuts paths down to the files' common ancestor).
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          retention-days: 1
          if-no-files-found: ignore
          path: |
            pom.xml
            **/target/*.jar
