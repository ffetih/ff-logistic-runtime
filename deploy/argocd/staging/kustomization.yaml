# Argo CD for ff-logistic-staging. Same install and patches as the parent directory,
# without root.yaml: ff-root would create every Application, Superset included.
# Staging runs Argo CD and deploy/cluster/staging-mailpit.yaml.
#
# The files live in the parent. kubectl refuses that unless the restrictor is off:
#   kubectl kustomize deploy/argocd/staging --load-restrictor LoadRestrictionsNone
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false

resources:
  - ../namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml

patches:
  - path: ../patches/argocd-cmd-params-cm.yaml
  - path: ../patches/argocd-server-service.yaml
  - path: ../patches/argocd-dex-server.yaml
  - path: ../patches/argocd-cm.yaml
  - path: ../patches/argocd-application-controller.yaml
  - path: ../patches/argocd-repo-server.yaml
