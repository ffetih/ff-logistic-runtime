# The analytics loader: Kafka to the analytics database (S6). Written once, in shared, and
# deployed whichever implementation is active: it reads the topics, not the code, of the side
# that sends them. So it is not one of the ApplicationSet's, which come and go with the switch.
#
# Two sources (decision 8: deploy values live next to the code):
#   1. the chart, from this repository: deploy/charts/ff-service
#   2. ff-logistic-shared as $values: deploy/apps/analytics-loader, where the loader is built.
#      Its CI writes the image tag there, so it never has to write to this repository.
# The last values file wins: image-local.yaml over values-local.yaml over values.yaml over the
# chart's defaults.
#
# Manual sync like the rest. Sync it after postgres and kafka: its PreSync Jobs create its
# database and tables, and it subscribes to the broker as it starts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-loader
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ff-logistics
spec:
  project: ff-logistics
  sources:
    - repoURL: https://github.com/ffetih/ff-logistic-runtime.git
      targetRevision: main
      path: deploy/charts/ff-service
      helm:
        releaseName: analytics-loader
        valueFiles:
          - $values/deploy/apps/analytics-loader/values.yaml
          - $values/deploy/apps/analytics-loader/values-local.yaml
          - $values/deploy/apps/analytics-loader/image-local.yaml
    - repoURL: https://github.com/ffetih/ff-logistic-shared.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ff-logistics
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
