# Superset (S08-01). Manual sync, after postgres: the PreSync Job creates its metadata
# database on that server. Not part of the switch. It reads the analytics database, which
# either side fills.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ff-logistics
spec:
  project: ff-logistics
  source:
    repoURL: https://github.com/ffetih/ff-logistic-runtime.git
    targetRevision: main
    path: deploy/platform/superset
  destination:
    server: https://kubernetes.default.svc
    namespace: ff-logistics
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
