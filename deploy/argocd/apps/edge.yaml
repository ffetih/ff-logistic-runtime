# The edge (decision 5): port 8081, the same URLs whichever implementation is active, and a
# PostSync smoke test through it. Sync it after every switch, once the new side is Healthy:
# the smoke test then checks the side that now answers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ff-logistics
spec:
  project: ff-logistics
  source:
    repoURL: https://github.com/ffetih/ff-logistic-runtime.git
    targetRevision: main
    path: deploy/platform/edge
    helm:
      releaseName: edge
  destination:
    server: https://kubernetes.default.svc
    namespace: ff-logistics
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
