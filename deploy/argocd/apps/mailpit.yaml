# Mailpit (S13). Manual sync. Not part of the switch: report mail lands here either way.
# Pinned (S14-04). Staging syncs a candidate revision first. A promotion commit moves
# the SHA below to that revision; until then this cluster stays on the pin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailpit
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ff-logistics
spec:
  project: ff-logistics
  source:
    repoURL: https://github.com/ffetih/ff-logistic-runtime.git
    targetRevision: adeea7b72da6f8577fd255204fbd89390c0f522b
    path: deploy/platform/mailpit
  destination:
    server: https://kubernetes.default.svc
    namespace: ff-logistics
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
