# Mailpit (S13). Manual sync. Not part of the switch: report mail lands here either way.
# Pinned (S14-04). Staging synced this revision first. This commit promotes
# ff-logistic to it. A later mailpit change waits for another promotion commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailpit
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ff-logistics
spec:
  project: ff-logistics
  source:
    repoURL: https://github.com/ffetih/ff-logistic-runtime.git
    targetRevision: cb79bd0913230cddc133c33211b16e2f70772721
    path: deploy/platform/mailpit
  destination:
    server: https://kubernetes.default.svc
    namespace: ff-logistics
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
