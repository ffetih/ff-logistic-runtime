# Local-only example credentials, committed on purpose so a fresh cluster works without any
# manual step. Never reuse them on a shared or production cluster; there they come from a
# secret store, not from Git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  username: fflogistics
  password: fflogisticsDb2026
---
# The analytics database's reader (ff_logistics_analytics, S08-04): row-level security applies
# to it, so it sees only the tenant a session names. The analytics loader's migration creates the
# role with this password; dashboards connect as it (S9). Local only, like the one above.
apiVersion: v1
kind: Secret
metadata:
  name: analytics-reader-credentials
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  username: analytics_reader
  password: analyticsReader2026
