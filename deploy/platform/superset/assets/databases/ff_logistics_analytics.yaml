# Read as analytics_reader. The password is not in this file: provision.py passes
# ANALYTICS_PASSWORD. A superuser would skip the row-level policy.
database_name: ff_logistics_analytics
sqlalchemy_uri: postgresql+psycopg2://analytics_reader:XXXXXXXXXX@postgres:5432/ff_logistics_analytics
cache_timeout: null
# SQL Lab runs whatever the signed-in user types, as analytics_reader. The chart
# guard is not that editor. Admin reads this database through a guest token.
expose_in_sqllab: false
allow_run_async: false
allow_ctas: false
allow_cvas: false
allow_dml: false
allow_file_upload: false
extra:
  allows_virtual_table_explore: true
