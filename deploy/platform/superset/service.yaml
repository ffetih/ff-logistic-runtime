# superset:8088 inside the cluster. NodePort 30088, which k3d publishes on host port 8088.
apiVersion: v1
kind: Service
metadata:
  name: superset
  labels:
    app.kubernetes.io/name: superset
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: superset
  ports:
    - name: http
      port: 8088
      targetPort: http
      protocol: TCP
      nodePort: 30088
