# Superset for the local cluster (S08-01). Applied by the superset Application
# (deploy/argocd/apps/superset.yaml) into the ff-logistics namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ff-logistics

resources:
  - secret.yaml
  - job-database.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: superset-config
    files:
      - superset_config.py
      - provision.py
      - assets/metadata.yaml
      - assets/databases/ff_logistics_analytics.yaml
      - assets/datasets/ff_logistics_analytics/tenant_delivery_monthly.yaml
      - assets/charts/Deliveries_per_month.yaml
      - assets/charts/Distance_per_month.yaml
      - assets/charts/Co2e_saved_per_month.yaml
      - assets/dashboards/Deliveries.yaml
