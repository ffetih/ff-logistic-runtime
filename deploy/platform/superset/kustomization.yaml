# Superset for the local cluster (S08-01). Applied by the superset Application
# (deploy/argocd/apps/superset.yaml) into the ff-logistics namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ff-logistics

resources:
  - secret.yaml
  - job-database.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: superset-config
    files:
      - superset_config_docker.py
      - register_analytics.py
