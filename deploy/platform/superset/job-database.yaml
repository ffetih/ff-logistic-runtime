# superset's metadata database, on the shared PostgreSQL, created if it is missing.
# The server's image creates databases only on an empty volume, and this one arrives later.
# A PreSync hook, so the pod's migration finds the database. The same Job on the next sync
# changes nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-database
  labels:
    app.kubernetes.io/name: superset-database
    app.kubernetes.io/part-of: ff-logistics
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superset-database
        app.kubernetes.io/part-of: ff-logistics
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: psql
          image: docker.io/library/postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -q; do sleep 2; done
              psql -v ON_ERROR_STOP=1 <<'SQL'
              SELECT 'CREATE DATABASE superset'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'superset')\gexec
              SQL
              echo "database superset is there"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
