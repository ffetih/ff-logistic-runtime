# Local-only example credentials, committed on purpose so a fresh cluster works without any
# manual step. Never reuse them on a shared or production cluster.
#
# The metadata database is the server's own user (postgres-credentials). analytics_reader
# cannot own it: that role may only read ff_logistics_analytics.
apiVersion: v1
kind: Secret
metadata:
  name: superset-credentials
  labels:
    app.kubernetes.io/name: superset
type: Opaque
stringData:
  secret-key: ff-superset-secret-dev-2026-local
  admin-password: supersetAdmin2026
