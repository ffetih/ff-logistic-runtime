# Inside the cluster: the headless Service gives the pod the name kafka-0.kafka, which is what
# the broker advertises. It publishes the address before the pod is Ready, so the broker can
# reach its own controller listener while it starts. Clients bootstrap with kafka:9092.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
    - name: controller
      port: 9093
      targetPort: controller
---
# From the host (an IDE run, a console client): k3d maps host port 9094 to NodePort 30094, and
# the external listener advertises localhost:9094, so a client outside comes back the same way.
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: external
      port: 9094
      targetPort: external
      nodePort: 30094
