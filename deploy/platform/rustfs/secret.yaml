# Local-only example credentials, committed on purpose so a fresh cluster works without any
# manual step. Never reuse them on a shared or production cluster; there they come from a
# secret store, not from Git.
#
# RustFS reads both keys as environment variables (the chart's secret.existingSecret); the
# logistics app signs its requests and links with the same pair.
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-credentials
  labels:
    app.kubernetes.io/name: rustfs
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: fflogistics
  RUSTFS_SECRET_KEY: fflogisticsS3-2026
