# Local-only example credentials, committed on purpose so a fresh cluster works without any
# manual step. Never reuse them on a shared or production cluster.
#
# identity-service-client-secret has to match the secret of the ff-logistics-service client
# in ff-logistics-realm.json. The broker key protects POST /service-tokens on the identity
# service; it is not a Keycloak secret.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  labels:
    app.kubernetes.io/name: keycloak
type: Opaque
stringData:
  admin-username: admin
  admin-password: admin
  identity-service-client-secret: ff-logistics-service-secret
  identity-broker-key: ff-identity-broker-dev
---
# The user the logistics app's PostSync smoke test signs in as (deploy/apps/logistics-app,
# smokeTest): a demo user of ff-logistics-realm.json with WAREHOUSE_OPERATOR, tenant
# ff-eu-freight. Kept here, next to the realm that defines the user.
apiVersion: v1
kind: Secret
metadata:
  name: smoke-test-user
  labels:
    app.kubernetes.io/name: keycloak
type: Opaque
stringData:
  username: nexus.planner
  password: fflogistics2026
