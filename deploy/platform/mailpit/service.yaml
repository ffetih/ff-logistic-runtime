# SMTP stays inside the cluster. The UI is NodePort 30092, which k3d publishes on host port 8092.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-ui
  labels:
    app.kubernetes.io/name: mailpit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: ui
      port: 8025
      targetPort: ui
      nodePort: 30092
