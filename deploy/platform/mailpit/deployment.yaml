# Mailpit, one process: SMTP on 1025, UI on 8025.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:v1.34.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MP_SMTP_BIND_ADDR
              value: 0.0.0.0:1025
            - name: MP_UI_BIND_ADDR
              value: 0.0.0.0:8025
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: ui
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
