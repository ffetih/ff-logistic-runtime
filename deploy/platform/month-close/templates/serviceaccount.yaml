# Dedicated account for month-close Workflow pods in the argo namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: month-close
  namespace: argo
  labels:
    app.kubernetes.io/name: month-close
    app.kubernetes.io/part-of: ff-logistics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: month-close-executor
  namespace: argo
  labels:
    app.kubernetes.io/name: month-close
    app.kubernetes.io/part-of: ff-logistics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-executor
subjects:
  - kind: ServiceAccount
    name: month-close
    namespace: argo
