# The event source and sensor account, plus a dedicated workflow-runner account so app pods
# running under the namespace's default ServiceAccount never inherit workflow RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-ready
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-ready
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - sensors
      - eventsources
      - eventbus
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - workflows
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-ready
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-ready
subjects:
  - kind: ServiceAccount
    name: report-ready
---
# Dedicated account for report-ready Workflow pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-runner
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
---
# The emissary in a workflow pod writes its result with the pod's own service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-executor
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-executor
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-executor
subjects:
  - kind: ServiceAccount
    name: workflow-runner
