# The event source and the sensor. The workflow they submit runs as the namespace's
# default account, which workflow-executor.yaml lets record its result.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-ready
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-ready
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - sensors
      - sensors/finalizers
      - sensors/status
      - eventsources
      - eventsources/finalizers
      - eventsources/status
      - eventbus
      - eventbus/finalizers
      - eventbus/status
      - workflows
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-ready
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-ready
subjects:
  - kind: ServiceAccount
    name: report-ready
---
# The emissary in a workflow pod writes its result with the pod's own service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-executor
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-executor
  labels:
    app.kubernetes.io/name: report-ready
    app.kubernetes.io/part-of: ff-logistics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-executor
subjects:
  - kind: ServiceAccount
    name: default
