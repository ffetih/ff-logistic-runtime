# Jaeger 2, one process: OTLP/HTTP on 4318, UI on 16686. No collector beside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/jaeger:2.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: JAEGER_LISTEN_HOST
              value: 0.0.0.0
          ports:
            - name: otlp
              containerPort: 4318
            - name: ui
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
