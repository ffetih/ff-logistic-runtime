# OTLP stays inside the cluster. The UI is NodePort 30186, which k3d publishes on host port 16686.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp
      port: 4318
      targetPort: otlp
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  labels:
    app.kubernetes.io/name: jaeger
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      nodePort: 30186
