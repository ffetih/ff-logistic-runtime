# Argo Rollouts controller and CRDs, pinned. Applied by the argo-rollouts Application
# (deploy/argocd/apps/argo-rollouts.yaml). An upgrade is a commit that changes the version
# below, then a sync of that Application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

resources:
  - namespace.yaml
  - https://github.com/argoproj/argo-rollouts/releases/download/v1.10.2/install.yaml
