{{- if .Values.database.create }}
# The service's own database, created on the shared PostgreSQL server if it is missing. The
# server's image creates databases only on its first start, on an empty volume, so a service
# that arrives later brings this step itself. Before the migration (PreSync, weight -1 against
# the migration's 0), so Flyway always finds the database it migrates. A database that exists
# is left as it is; the Job is the same every sync and changes nothing the second time.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: {{ include "ff-service.name" . }}-database-
  labels:
    app.kubernetes.io/name: {{ include "ff-service.name" . }}-database
    app.kubernetes.io/part-of: ff-logistics
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-1"
spec:
  ttlSecondsAfterFinished: {{ .Values.hookJobTtlSeconds }}
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ff-service.name" . }}-database
        app.kubernetes.io/part-of: ff-logistics
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: psql
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminSecret | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminSecret | quote }}
                  key: password
            - name: DATABASE
              value: {{ required "database.name is required with database.create" .Values.database.name | quote }}
          # CREATE DATABASE cannot run in a transaction or a function, hence \gexec: the SELECT
          # writes the statement only when the database is missing, and psql runs what it wrote.
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -q; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -v db="$DATABASE" <<'SQL'
              SELECT format('CREATE DATABASE %I', :'db')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db')\gexec
              SQL
              echo "database $DATABASE is there"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
