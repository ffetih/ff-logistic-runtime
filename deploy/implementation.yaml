# The switch (decision 4): which implementation of FF Logistic runs. One of:
#   modulith   ff-logistic-modulith: logistics-app
#   services   ff-logistic-services: warehousing, transportation, routing and their gateway
#
# Changing it is a commit. The ff-implementation ApplicationSet (deploy/argocd/apps) then renders
# the Applications of that side only and deletes the other side's, with their workloads. Both
# sides use the same tables, so the data stays. Afterwards: sync the new side's Applications,
# then the edge, whose smoke test checks the side that now answers.
active: services
